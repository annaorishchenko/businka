# =============================================================================
# nginx.conf — HTTP-конфиг для первичного запуска (до выпуска SSL).
# Копируется в /etc/nginx/conf.d/default.conf.
# server_tokens off задаётся через include в /etc/nginx/conf.d/ — добавляем
# отдельным http-уровнем через server_tokens-директиву (валидна в server).
# =============================================================================

# Скрываем версию nginx в Server-заголовке и страницах ошибок.
server_tokens off;

# Gzip-сжатие текстовых ресурсов.
gzip on;
gzip_vary on;
gzip_proxied any;
gzip_comp_level 6;
gzip_min_length 1024;
gzip_types
    text/plain
    text/css
    text/xml
    application/javascript
    application/x-javascript
    application/json
    application/xml
    application/xml+rss
    image/svg+xml
    font/woff
    font/woff2;

server {
    listen 80 default_server;
    listen [::]:80 default_server;

    # _ ловит любой Host — на проде заменяется через nginx-ssl.conf,
    # либо переопределяется переменной DOMAIN при необходимости.
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Точка входа ACME-челленджа для certbot --webroot.
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # ----- Security headers (применяются ко всем ответам) -----
    add_header X-Frame-Options           "DENY"                                              always;
    add_header X-Content-Type-Options    "nosniff"                                           always;
    add_header Referrer-Policy           "strict-origin-when-cross-origin"                   always;
    add_header Permissions-Policy        "geolocation=(), camera=(), microphone=()"          always;
    add_header X-XSS-Protection          "1; mode=block"                                     always;

    # ----- Кэш статики с хэшами в имени (Vite кладёт их в /assets) -----
    location ~* \.(?:js|css|woff2?|ttf|eot|otf|png|jpe?g|gif|webp|avif|svg|ico|mp4|webm)$ {
        expires 1y;
        access_log off;
        add_header Cache-Control "public, immutable" always;

        # Дублируем security-заголовки — add_header в location перекрывает родителя.
        add_header X-Frame-Options           "DENY"                                              always;
        add_header X-Content-Type-Options    "nosniff"                                           always;
        add_header Referrer-Policy           "strict-origin-when-cross-origin"                   always;
        add_header Permissions-Policy        "geolocation=(), camera=(), microphone=()"          always;
        add_header X-XSS-Protection          "1; mode=block"                                     always;
    }

    # ----- index.html не кэшируем — иначе пользователи застрянут на старой версии -----
    location = /index.html {
        add_header Cache-Control "no-cache" always;

        add_header X-Frame-Options           "DENY"                                              always;
        add_header X-Content-Type-Options    "nosniff"                                           always;
        add_header Referrer-Policy           "strict-origin-when-cross-origin"                   always;
        add_header Permissions-Policy        "geolocation=(), camera=(), microphone=()"          always;
        add_header X-XSS-Protection          "1; mode=block"                                     always;
    }

    # ----- SPA-fallback: всё неизвестное отдаём через index.html -----
    location / {
        try_files $uri $uri/ /index.html;
    }
}
