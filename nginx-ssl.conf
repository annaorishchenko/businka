# =============================================================================
# nginx-ssl.conf — конфиг после выпуска SSL-сертификата.
# Подменяет nginx.conf и копируется в /etc/nginx/conf.d/default.conf.
# ${DOMAIN} нужно подставить (sed) перед копированием — это делает init-ssl.sh.
# =============================================================================

server_tokens off;

# Gzip-сжатие.
gzip on;
gzip_vary on;
gzip_proxied any;
gzip_comp_level 6;
gzip_min_length 1024;
gzip_types
    text/plain
    text/css
    text/xml
    application/javascript
    application/x-javascript
    application/json
    application/xml
    application/xml+rss
    image/svg+xml
    font/woff
    font/woff2;

# -----------------------------------------------------------------------------
# 80 → ACME-челлендж + редирект на HTTPS.
# -----------------------------------------------------------------------------
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name ${DOMAIN} www.${DOMAIN};

    # ACME-челлендж нужен и после выпуска (для авторенью).
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # Всё остальное — на HTTPS.
    location / {
        return 301 https://$host$request_uri;
    }
}

# -----------------------------------------------------------------------------
# 443 — основной HTTPS-сервер.
# -----------------------------------------------------------------------------
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name ${DOMAIN} www.${DOMAIN};

    # ----- Сертификаты Let's Encrypt -----
    ssl_certificate     /etc/letsencrypt/live/${DOMAIN}/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/${DOMAIN}/privkey.pem;

    # ----- Mozilla intermediate (актуально для 2025+) -----
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384;

    ssl_session_timeout 1d;
    ssl_session_cache shared:MozSSL:10m;
    ssl_session_tickets off;

    # OCSP stapling.
    ssl_stapling on;
    ssl_stapling_verify on;
    resolver 1.1.1.1 8.8.8.8 valid=300s;
    resolver_timeout 5s;

    root /usr/share/nginx/html;
    index index.html;

    # ----- HSTS (только на HTTPS!) -----
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;

    # ----- Security headers -----
    add_header X-Frame-Options           "DENY"                                              always;
    add_header X-Content-Type-Options    "nosniff"                                           always;
    add_header Referrer-Policy           "strict-origin-when-cross-origin"                   always;
    add_header Permissions-Policy        "geolocation=(), camera=(), microphone=()"          always;
    add_header X-XSS-Protection          "1; mode=block"                                     always;

    # ----- Кэш статики -----
    location ~* \.(?:js|css|woff2?|ttf|eot|otf|png|jpe?g|gif|webp|avif|svg|ico|mp4|webm)$ {
        expires 1y;
        access_log off;
        add_header Cache-Control "public, immutable" always;

        add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
        add_header X-Frame-Options           "DENY"                                              always;
        add_header X-Content-Type-Options    "nosniff"                                           always;
        add_header Referrer-Policy           "strict-origin-when-cross-origin"                   always;
        add_header Permissions-Policy        "geolocation=(), camera=(), microphone=()"          always;
        add_header X-XSS-Protection          "1; mode=block"                                     always;
    }

    # ----- index.html не кэшируем -----
    location = /index.html {
        add_header Cache-Control "no-cache" always;

        add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
        add_header X-Frame-Options           "DENY"                                              always;
        add_header X-Content-Type-Options    "nosniff"                                           always;
        add_header Referrer-Policy           "strict-origin-when-cross-origin"                   always;
        add_header Permissions-Policy        "geolocation=(), camera=(), microphone=()"          always;
        add_header X-XSS-Protection          "1; mode=block"                                     always;
    }

    # ----- SPA fallback -----
    location / {
        try_files $uri $uri/ /index.html;
    }
}
